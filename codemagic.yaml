workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      # ─── Code Signing ─────────────────────────────────────────────────────────
      # Configure in Codemagic UI → Teams → Code signing identities
      # Distribution certificate + App Store provisioning profile
      ios_signing:
        distribution_type: app_store           # options: app_store | ad_hoc | development
        bundle_identifier: com.funmate.app      # ← UPDATE to your actual bundle ID

      # ─── Environment Variables ────────────────────────────────────────────────
      # Set these in Codemagic UI → Workflow → Environment variables
      # Mark sensitive values as "Secure"
      vars:
        XCODE_PROJECT: "ios/FunmateApp.xcodeproj"
        XCODE_WORKSPACE: "ios/FunmateApp.xcworkspace"
        XCODE_SCHEME: "FunmateApp"
        BUNDLE_ID: "com.funmate.app"            # ← UPDATE to your actual bundle ID
        # APP_STORE_APPLE_ID: "1234567890"      # ← Uncomment & set for build number auto-increment
        # GOOGLE_SERVICE_INFO_PLIST: <base64 of GoogleService-Info.plist>  # Secure env var

      node: v18.20.7
      xcode: latest
      cocoapods: default

    # ─── Triggering ─────────────────────────────────────────────────────────────
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: "v*"
          include: true

    # ─── Build Scripts ───────────────────────────────────────────────────────────
    scripts:
      - name: Set up GoogleService-Info.plist (Firebase iOS config)
        script: |
          # Decode the base64-encoded GoogleService-Info.plist from secure env var
          # Set GOOGLE_SERVICE_INFO_PLIST in Codemagic UI as a secure environment variable
          # (base64-encoded content of your GoogleService-Info.plist)
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > \
              "$CM_BUILD_DIR/ios/FunmateApp/GoogleService-Info.plist"
            echo "GoogleService-Info.plist written successfully."
          else
            echo "WARNING: GOOGLE_SERVICE_INFO_PLIST env var not set. Firebase may not work."
          fi

      - name: Install npm dependencies
        script: |
          npm ci

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Apply code signing settings
        script: |
          xcode-project use-profiles

      - name: Increment build number (from TestFlight)
        script: |
          # Requires APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
          # APP_STORE_CONNECT_PRIVATE_KEY and APP_STORE_APPLE_ID env vars to be set.
          # Comment out this step if you prefer to manage build numbers manually.
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
            cd ios
            agvtool new-version -all $(($LATEST + 1))
            echo "Build number set to $(($LATEST + 1))"
          else
            echo "APP_STORE_APPLE_ID not set — skipping build number increment."
          fi

      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    # ─── Artifacts ──────────────────────────────────────────────────────────────
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # ─── Publishing ─────────────────────────────────────────────────────────────
    publishing:
      # Requires App Store Connect API key set up in Codemagic UI
      # Teams → Integrations → App Store Connect
      app_store_connect:
        auth: integration

        # Upload to TestFlight and notify testers
        submit_to_testflight: true
        beta_groups:
          - Internal Testers            # ← UPDATE to your actual TestFlight group name

        # Set to true to also submit for App Store review
        submit_to_app_store: false

      email:
        recipients:
          - your@email.com              # ← UPDATE with your notification email
        notify:
          success: true
          failure: true
