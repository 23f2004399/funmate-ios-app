workflows:
  ios-release:
    name: iOS TestFlight Build
    max_build_duration: 60
    environment:
      node: 18
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.funmateapp"  # verify this matches your actual bundle ID
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Write GoogleService-Info.plist
        script: echo $GOOGLE_SERVICE_INFO_PLIST > ios/FunmateApp/GoogleService-Info.plist
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace ios/FunmateApp.xcworkspace \
            --scheme FunmateApp
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true